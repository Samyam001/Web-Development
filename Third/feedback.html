<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">My Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="feedback.html">Feedback</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="photos.html">Photos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="feedback-card">
            <h2 class="page-title sticky-heading">Feedback Form</h2>

            <form id="feedback-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" minlength="3" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>

                <p><strong>Rating</strong></p>
                <input type="radio" id="very_satisfied" name="rating" value="Very Satisfied" required>
                <label for="very_satisfied">Very Satisfied</label><br>

                <input type="radio" id="satisfied" name="rating" value="Satisfied">
                <label for="satisfied">Satisfied</label><br>

                <input type="radio" id="neutral" name="rating" value="Neutral">
                <label for="neutral">Neutral</label><br>

                <input type="radio" id="unsatisfied" name="rating" value="Unsatisfied">
                <label for="unsatisfied">Unsatisfied</label>

                <p><strong>Interests</strong></p>
                <input type="checkbox" id="web_dev" name="interests" value="Web Development">
                <label for="web_dev">Web Development</label><br>

                <input type="checkbox" id="mobile_dev" name="interests" value="Mobile Development">
                <label for="mobile_dev">Mobile Development</label><br>

                <input type="checkbox" id="ai_ml" name="interests" value="AI & Machine Learning">
                <label for="ai_ml">AI & Machine Learning</label>

                <label for="country">Country:</label>
                <select id="country" name="country" required>
                    <option value="">-- Select a Country --</option>
                    <option value="Nepal">Nepal</option>
                    <option value="Canada">Canada</option>
                    <option value="United Kingdom">United Kingdom</option>
                </select>

                <label for="feedback"><strong>Write your feedback here:</strong></label><br>
                <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Enter your feedback..." minlength="10" maxlength="500" required></textarea>

                <input type="submit" <p style="color: #0e423e; font-weight: bold; " value="Submit">
            </form>

            <center><p style="color: #0f766e; font-weight: bold;">Your feedback helps improve the experience.</p></center>
            
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
